name: "Little Muslim Nation Urdu"
slug: "little-muslim-nation"
language: "English"   # switched to English for voiceover; set "Urdu" (native script) or "Roman Urdu" to change
made_for_kids: true
storytelling: true    # 2026-07-25: story-poem mode — visuals form ONE continuous story arc
allow_humans: true    # cartoon Muslim kids are the cast (stylized faces allowed, not photoreal)
target_audience: "Muslim children 3-9 and their families, Urdu speaking (South Asia + diaspora)"
inspired_by: "Little Muslim Nation (LMN Urdu) — Islamic stories & values for kids"
vibe: "Gentle, reverent, warm, uplifting — teaches Islamic manners (akhlaq) and values through soft stories"

format: "Islamic values story for kids — good manners, gratitude, kindness, honesty, prayer, sharing — told through a friendly talking-animal cast"
episode_structure:
  - "HOOK: a beautiful calm frame + a narration line introducing today's good habit / value"
  - "SETUP: the animal character in a wholesome everyday situation"
  - "MOMENT: a chance to practice (or forget) a good Islamic manner"
  - "GENTLE LESSON: a wise elder character explains the value warmly"
  - "RESOLUTION: the character practices the good deed and feels the goodness of it"
  - "CLOSING: restate the value warmly (e.g. shukar, sabr, sachai) + a peaceful loopable frame"

character_system: "Recurring cast of CARTOON Muslim kids (Pixar-style 3D, NOT realistic). Repeat the EXACT descriptors below every scene so the cast stays identical. A trained character LoRA locks them further."
character_bible:
  - "Yusuf (boy, 3-4 yrs): cute chubby-cheeked 3D cartoon boy, white knit prayer cap (taqiyah), short brown curly hair, big warm brown eyes, sky-blue kurta with white embroidery, friendly smile"
  - "Maryam (girl, 3-4 yrs): cute 3D cartoon girl, soft mint-teal hijab, big bright green eyes, rosy cheeks, gentle teal dress, sweet smile"
  - "Aisha (girl, 3-4 yrs): cute 3D cartoon girl, soft pink hijab, big brown eyes, rosy cheeks, light pink dress, cheerful smile"

art_style_phrase: "soft 3D Pixar-style cartoon render, big expressive eyes, rounded chubby features, smooth subsurface skin shading, glossy highlights, polished children's animation movie look"
color_palette: "bright cheerful pastels — sky blue, mint, pink, cream, soft gold; sunny and warm"
visual_style:
  - "Polished 3D animated-movie CARTOON style (like a modern kids feature film) — NEVER photorealistic, never realistic skin"
  - "Cute stylized Muslim kids with big eyes and rounded faces; modest dress, hijab for girls, taqiyah/kurta for boy"
  - "Charming wholesome settings: sunny pastel old-town streets, gardens, cozy homes, mosque domes softly in the background"
  - "Warm cinematic daylight, soft depth of field, bokeh background, beautifully rendered"
  - "Repeat the art_style_phrase and each character's EXACT descriptors in EVERY prompt they appear in"
negative_prompt_additions: "photorealistic, realistic skin, real human photo, uncanny, text, watermark, scary, dark, harsh lighting, deformed, extra limbs, extra fingers, blurry, low quality, immodest clothing, extreme close-up, macro, face only, head only, cropped frame"
framing_directive: "Default to WIDE SHOTS and MEDIUM-WIDE SHOTS showing full body + environment. Only use close-ups when a scene explicitly calls for emotion. Every prompt MUST include one of: 'wide shot', 'full body shot', 'medium wide shot' — this prevents the zoomed-in face problem."
still_ratio: 0.0   # every scene is a real animated video clip (img2vid), not a static still
scene_type_directive: "Use scene_type 'img2vid' for EVERY scene: a consistent SDXL still then ANIMATED by LTX (real motion, not a static Ken Burns pan). Each prompt MUST describe the character DOING a gentle action + ambient motion."

narration:
  language: "English"
  voice: "warm gentle female storyteller"
  pace: "slow, calm, reverent"
  style: "simple respectful kid-friendly Urdu; naturally weave one Islamic value; end by naming the value clearly"

music:
  style: "soft music-free friendly ambience or very light gentle nasheed-style vocal hum, calm and minimal"
  mood: "peaceful, reverent, warm"
  tempo: "slow (60-80 bpm)"
  note: "many Islamic kids channels prefer music-free / vocals-only — keep audio minimal and gentle"

title_formulas:
  - "{value} ki kahani — Islamic Moral Story for Kids (Urdu), e.g. شکر کی کہانی"
  - "Warm + value-forward in Urdu script, short English search tail"
seo_themes:
  - "islamic stories for kids urdu, akhlaq, good manners islam, bachon ke liye islami kahani, muslim kids values, gratitude kindness honesty"

generation:
  target_resolution: "1080p"
  video_base: "1280x720"
  clip_seconds: [5, 7]
  prefer: "still_pan for characters & emotion; txt2vid only for ambient motion (gardens, sky, water)"
  video_model: "LTX-2.3-22B-distilled-1.1-Q3_K_S.gguf"
  default_loras: []

avoid:
  - "any depiction of prophets or sacred figures"
  - "photorealistic / realistic human faces (the cast is stylized 3D cartoon kids — cartoon faces are fine)"
  - "violence, fear, anything disrespectful or restricted-mode risky"
  - "focal rendered text or calligraphy (AI renders it wrong)"
  - "complex multi-character action in a single clip"
